<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .header {
            text-align: center;
            background: #066aab;
            color: #fff;
            padding: 20px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .content {
            line-height: 1.6;
            text:center;
        }

        .content p {
            margin: 10px 0;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class='container'>
        <div class='header'>
        <img src='assets/img/encabezado.png' alt='Encabezado' style='max-width: 100%; height: auto;'>
        </div>
        <div class='content' style='text-align: center;'>
            <h2>Hola <b>$nombre</b>,</h2>
            <p>Tu PQRS ha sido recibida con éxito. El número de radicado es:</p>
            <h3 style="color: #066aab;">$numero_radicado</h3>
            <p>Estaremos tramitándola y resolviéndola en el menor tiempo posible. Te informaremos por esta vía la respuesta y los pasos a seguir si hay lugar.</p>
        </div>
        <div class='footer'>
        <img src='assets/img/contenido.png' alt='Contenido' style='max-width: 100%; height: auto;'>
        <p style="font-size: 14px; color: #555; font-style: italic; text-align: center; margin-top: 10px;">
            <strong>Nota:</strong> Este es un correo automático, por favor no responda.
        </p>
        
        </div>
    </div>
</body>

</html>
